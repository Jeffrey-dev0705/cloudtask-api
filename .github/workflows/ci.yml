name: CI
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        env:
          DATABASE_URL: sqlite:///./ci.db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-secret
        run: pytest -q
      - name: Docker build
        run: docker build -t cloudtask-api:${{ github.sha }} .
