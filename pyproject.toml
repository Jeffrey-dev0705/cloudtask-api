[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudtask-api"
version = "0.2.0"
description = "Multi-tenant async job API (FastAPI, Celery, PostgreSQL, Redis)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-jose[cryptography]>=3.3,<4",
  "passlib[bcrypt]>=1.7,<2",
  "bcrypt>=4.0.1,<4.1",
  "celery[redis]>=5.4,<6",
  "prometheus-client>=0.20,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1",
  "redis>=5,<6"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]
ignore = [
  "B008",  # FastAPI Depends/Header/Query in defaults
  "E501",  # line length enforced via line-length / formatter
  "E701",  # existing compact one-liner style
  "E702",  # existing compact one-liner style
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
